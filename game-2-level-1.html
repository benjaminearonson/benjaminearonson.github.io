<div class="level-1">
    <div class="aronson">
        <!-- using HTML Map - each button sits x% right of the left ledge of the div-->
        <!-- and y% down from the top edge of the div using left:x%; right:y% -->
        <!-- and the width and height are as expected using percentages of div width and height -->
        <img src="aronson-capital.png" alt="An ad for Aronson Capital">
        <button class="hotspot" type="button" style="left:45.8%; 
        top:14.4%; width:43.8%; height:14.4%;"></button>
        <button class="hotspot" type="button" style="left:6.35%;
        top:25.1%; width:34.9%; height:9.8%;"></button>
        <button class="hotspot" type="button" style="left:6.35%;
        top:36%; width:34.9%; height:9.8%;"></button>
        <!-- Here I'll put incorrect answers so their boxes show up on hover -->
        <button class="hotspot" id="wrong-answer" type="button" style="left:4.90%;
        top:8.98%; width:25.31%; height:11.85%;"></button>
        <button class="hotspot" type="button" style="left:70.5%;
        top:83.8%; width:24.58%; height:5.83%;"></button>
        <button class="hotspot" type="button" style="left:5%;
        top:56.7%; width:21.7%; height:15%;"></button>
        <button class="hotspot" type="button" style="left:28.6%;
        top:59.8%; width:12%; height:8.7%;"></button>
        <button class="hotspot" type="button" style="left:4.8%;
        top:81.85%; width:37.55%; height:8.7%;"></button>
        
          <!-- here I'll put a popup with a class that makes it
          invisible until a function gets triggered in game2.js
          at which point a class will be added that makes it visible-->
          <div class="popup">
            <div class="hide" id="myPopup">
              You've run out of lives!
              <a href="game-2.html" class="restart-button">Start over</a>
            </div>
          </div>
    </div>
    
</div>

<div class="invest-button-and-flag-counter">
    <div></div>
    <!-- this is how we communicate with game2.js -- each span is given an id that is accessed
     by the js file. anything in the span can be edited using .textContent in js -->
    <button class="invest-button" id="invest-button" onclick="window.location.href='level-1-invest.html'"><b>Invest!</b></button>
    <div class="red-flag-text">Red flags found: <span id="red-flag-counter">3</span></div>
    <div class="red-flag-text">Lives: <span id="life_counter"></span></div>
    <div></div>
</div>

<div class="level-1">
    <div class="aronson">
        <!-- using HTML Map - each button sits x% right of the left ledge of the div-->
        <!-- and y% down from the top edge of the div using left:x%; right:y% -->
        <!-- and the width and height are as expected using percentages of div width and height -->
        <img src="Crypto email.png" alt="An ad for Aronson Capital">
        <button class="hotspot" type="button" style="left:27.2%; 
        top:26.5%; width:29.7%; height:6%;"></button>
        <button class="hotspot" type="button" style="left:6.3%;
        top:63.3%; width:85.2%; height:9.8%;"></button>
        <button class="hotspot" type="button" style="left:6.3%;
        top:77%; width:87%; height:6%;"></button>
        
          <!-- here I'll put a popup with a class that makes it
          invisible until a function gets triggered in game2.js
          at which point a class will be added that makes it visible-->
          <div class="popup">
            <div class="hide" id="myPopup">
              You've run out of lives!
              <a href="game-2.html" class="restart-button">Start over</a>
            </div>
          </div>
    </div>
    
</div>

<div class="invest-button-and-flag-counter">
    <div></div>
    <!-- this is how we communicate with game2.js -- each span is given an id that is accessed
     by the js file. anything in the span can be edited using .textContent in js -->
    <button class="invest-button" id="invest-button" onclick="window.location.href='level-1-invest.html'"><b>Looks legit; Invest!</b></button>
    <div class="red-flag-text">Red flags found: <span id="red-flag-counter">3</span></div>
    <div class="red-flag-text">Lives: <span id="life_counter"></span></div>
    <div></div>
</div>
